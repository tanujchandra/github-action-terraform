name: Terraform DevSecOps Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:

      ##################################################
      # Checkout Code
      ##################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ##################################################
      # Install Terraform
      ##################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      ##################################################
      # Azure Login
      ##################################################

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }

      ##################################################
      # Terraform Init
      ##################################################

      - name: Terraform Init
        run: terraform init

      ##################################################
      # Terraform Format
      ##################################################

      - name: Terraform Format
        run: terraform fmt -check -recursive

      ##################################################
      # Terraform Validate
      ##################################################

      - name: Terraform Validate
        run: terraform validate

      ##################################################
      # TFLint
      ##################################################

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint --format json > tflint-report.json

      ##################################################
      # tfsec
      ##################################################

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          format: sarif
          additional_args: --out tfsec-report

      ##################################################
      # Infracost
      ##################################################

      - name: Setup Infracost
        uses: infracost/actions/setup@v3

      - name: Generate Infracost Report
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown \
            --path . \
            --format json \
            --out-file infracost.json

      ##################################################
      # SonarQube Scan
      ##################################################

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      ##################################################
      # Terraform Plan
      ##################################################

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Save Plan Output
        run: terraform show tfplan > terraform-plan.txt

      ##################################################
      # Upload tfsec SARIF to GitHub Security
      ##################################################

      - name: Upload tfsec SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec-report.sarif

      ##################################################
      # Upload Reports
      ##################################################

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: Terraform-Reports
          path: |
            tflint-report.json
            tfsec-report.sarif
            infracost.json
            terraform-plan.txt

      ##################################################
      # Terraform Apply
      ##################################################

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
